# Ship Date Engine CI/CD Pipeline
name: Ship Date Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  PYRIGHT_VERSION: '1.1.357'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov boto3
      
      - name: Test with pytest
        run: |
          pytest tests/ --cov=ship_date_engine --cov-report=xml --cov-report=term-missing
        continue-on-error: true  # Allow failures for older Python versions
    
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pyright
        run: |
          pip install pyright
      
      - name: Run pyright type checking
        run: |
          pyright ship_date_engine/
      
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run secret scanner
        uses: lannonbr/reviewdog-action-github-pr-review@main
        with:
          tool_code_scanning: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install black flake8 isort mypy
      
      - name: Check code formatting (black)
        run: |
          black --check ship_date_engine/ tests/
        continue-on-error: true
      
      - name: Run flake8 linting
        run: |
          flake8 ship_date_engine/ tests/ --max-line-length=120
        continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pytest boto3
      
      - name: Run integration tests
        run: |
          pytest tests/ -m integration -v --tb=short
